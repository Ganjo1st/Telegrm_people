name: Telegram Bot Runner

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Защита от одновременного запуска двух экземпляров
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Restore Database
        uses: actions/cache/restore@v4
        with:
          path: pr_bot.db
          key: pr-bot-db-${{ github.repository }}-${{ github.run_id }}
          restore-keys: |
            pr-bot-db-${{ github.repository }}-
          
      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          PROXY_API_URL: ${{ secrets.PROXY_API_URL }}
          USER_ID: ${{ secrets.USER_ID }}  # Ваш ID для админ-панели
        run: python main.py
        
      - name: Save Database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pr_bot.db
          key: pr-bot-db-${{ github.repository }}-${{ github.run_id }}
